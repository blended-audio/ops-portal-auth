<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - OPS Portal</title>
<!--
  OPS PORTAL V2 - sign-in page
  Created 7 September 2026. Restyled 9 September 2026 to match the V2 portal card.

  WHY THIS PAGE EXISTS AT ALL
  Google's sign-in refuses to run inside an Apps Script page, because Apps Script
  serves its pages from a sandbox that Google will not accept as a first-party
  origin. So the sign-in has to happen on an ordinary web page that we control,
  in a popup, which then hands the result back.

  DO NOT TOUCH auth.html IN THIS SAME REPO. That one belongs to OPS Portal V1
  and uses a different client id. Breaking it takes the live portal's login down.

  WHAT HAPPENS
  1. The portal opens this page in a popup, passing a one-time nonce and its own
     origin in the address.
  2. Google signs the person in and hands back an identity token. The nonce is
     baked INTO that token by Google, so the portal can later prove the token was
     issued for this exact request and not replayed from somewhere else.
  3. This page posts the token back to the portal and closes.

  This page never sees a password and never stores anything.

  STYLING ONLY BELOW THIS LINE UNTIL THE SCRIPT TAG. The sign-in logic is
  load-bearing - the nonce and origin handling is what stops this page being a
  token-harvesting route. Do not change it while adjusting the look.
-->
<style>
  /* Two palettes, chosen by ?theme= on the address. This page cannot read the
     portal's localStorage - different origin - so the portal passes its theme
     when it opens the window. Dark is the default AND the fallback: anything
     other than the exact string "light" lands here. The values match the
     portal's own gate, so the popup and the card behind it agree. */
  :root, :root[data-theme="dark"] { color-scheme:dark;
    --bg:#12110F; --glow:rgba(242,182,128,.13); --card:#181613; --bdr:#3A332B;
    --shadow:rgba(42,31,21,.65); --txt:#ECE7DF; --sub:#8B8178;
    --errbg:#1F0A0A; --errbdr:#7F1D1D; --errtxt:#FCA5A5; }
  :root[data-theme="light"] { color-scheme:light;
    --bg:#F5F1EA; --glow:rgba(161,92,19,.10); --card:#FFFFFF; --bdr:#DCD3C6;
    --shadow:rgba(80,60,40,.14); --txt:#2A2521; --sub:#6B6157;
    --errbg:#FDECEC; --errbdr:#F0B4B1; --errtxt:#8C1D18; }

  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--txt);
              font-family:"Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif; }
  #bg { position:fixed; inset:0; pointer-events:none;
        background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--glow) 0%,transparent 70%); }
  .wrap { position:relative; display:flex; align-items:center; justify-content:center;
          height:100%; padding:20px; box-sizing:border-box; }
  .box { background:var(--card); border:1px solid var(--bdr); border-radius:18px;
         padding:34px 36px 28px; width:360px; max-width:100%; text-align:center;
         box-shadow:0 32px 80px var(--shadow); }
  /* Two lockups, one shown. The original is drawn in light ink for a dark
     ground - on a light card the wordmark disappears entirely. Same fix as the
     portal's sidebar, and the same reason a CSS filter will not do: it cannot
     darken the white type while leaving AUDIO amber. */
  .logo { display:block; width:100%; height:auto; max-width:265px; margin:0 auto 16px; }
  .logo.lt { display:none; }
  :root[data-theme="light"] .logo.dk { display:none; }
  :root[data-theme="light"] .logo.lt { display:block; }
  h1 { font-size:19px; color:var(--txt); margin:0 0 6px; font-weight:700; letter-spacing:0; }
  p  { font-size:12px; color:var(--sub); margin:0 0 22px; line-height:1.6; }
  #btn { display:flex; justify-content:center; min-height:44px; }
  #err { display:none; background:var(--errbg); border:1px solid var(--errbdr); border-radius:8px;
         padding:14px; font-size:13px; color:var(--errtxt); line-height:1.7; margin-top:16px;
         white-space:pre-wrap; text-align:center; }
  #err.on { display:block; animation:rv .34s ease both; }
  @keyframes rv { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  @media (max-width:520px) {
    .box { padding:26px 20px 22px; }
    #logo { max-width:210px; }
  }
</style>

<script>
/* Before the body paints, so there is no flash of the wrong theme. Reads the
   address only - this page stores nothing and never has. Nothing here touches
   the sign-in logic below; the theme is cosmetic and is NOT part of the origin
   check that stops this page being a token-harvesting route. */
(function () {
  var m = /[?&]theme=([^&]*)/.exec(window.location.search);
  var t = m ? decodeURIComponent(m[1]) : 'dark';
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
})();
</script>
</head>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var CLIENT_ID = '294357610001-me215me700nhsrt20h1ant1qg2djjpiq.apps.googleusercontent.com';

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var nonce  = qs('nonce');
  var target = qs('origin');

  function fail(msg) {
    var e = document.getElementById('err');
    e.textContent = msg;
    e.className = 'on';
  }

  if (!nonce || !target) {
    fail('This page was opened directly. Open the portal and sign in from there.');
    return;
  }

  // Only ever post back to a Google Apps Script origin. A page that posted a
  // token to any origin handed to it in the address bar would be a way to
  // harvest tokens, so the allowed shape is pinned here.
  // Apps Script serves its pages from a long random host under
  // googleusercontent.com, which can carry dots as well as hyphens. Anything
  // outside Google's own domains is refused and nothing is sent.
  if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(target) &&
      !/^https:\/\/script\.google\.com$/.test(target)) {
    fail('That portal address is not recognised. Nothing was sent.');
    return;
  }

  function onCredential(resp) {
    if (!resp || !resp.credential) { fail('Google did not return a sign-in. Try again.'); return; }
    window.opener && window.opener.postMessage({
      source: 'ops-portal-v2-auth',
      nonce: nonce,
      credential: resp.credential
    }, target);
    window.close();
  }

  var tries = 0;
  (function start() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      if (++tries > 60) { fail('Could not reach Google sign-in. Check your connection and try again.'); return; }
      return setTimeout(start, 100);
    }
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: onCredential,
      nonce: nonce,
      auto_select: false,
      cancel_on_tap_outside: false
    });
    google.accounts.id.renderButton(document.getElementById('btn'), {
      theme: (document.documentElement.getAttribute('data-theme') === 'light'
              ? 'outline' : 'filled_black'),
      size: 'large', text: 'signin_with', shape: 'pill', width: 300
    });
  })();
})();
</script>
